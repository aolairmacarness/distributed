syntax = "proto3";

package jobs;

service JobsService {
    rpc Acknowledge(AcknowledgeRequest) returns (AcknowledgeResponse) {}
    rpc Fail(FailRequest) returns (FailResponse) {}
}

message AcknowledgeRequest {
    int32 jobId = 1;
}

message AcknowledgeResponse {}

message FailRequest {
    int32 jobId = 1;
}

message FailResponse {}
