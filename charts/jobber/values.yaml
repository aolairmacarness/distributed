global:
  imagePullPolicy: Always

# Name of an existing Secret with keys JWT_SECRET and DB_PASSWORD. When empty,
# the chart creates "jobber-secrets" from auth.jwt.secret and
# postgresql.auth.password (both required).
secrets:
  existingSecret: ""

# Default-deny ingress with explicit allows for gRPC callers.
networkPolicy:
  enabled: true

# Applied to every app container.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

ingress:
  alb: false

persistence:
  ebs: false

pulsar:
  namespace: pulsar
  namespaceCreate: true
  components:
    proxy: false
  zookeeper:
    replicaCount: 1
    podMonitor:
      enabled: false
  broker:
    replicaCount: 1
    podMonitor:
      enabled: false
  bookkeeper:
    replicaCount: 1
    podMonitor:
      enabled: false
  autorecovery:
    podMonitor:
      enabled: false
  proxy:
    podMonitor:
      enabled: false
  kube-prometheus-stack:
    enabled: false
    prometheusOperator:
      enabled: false
    grafana:
      enabled: false
    alertmanager:
      enabled: false
    prometheus:
      enabled: false

postgresql:
  namespaceOverride: postgresql
  auth:
    username: postgres
    # Never commit a password here. Pass it at install time:
    #   --set postgresql.auth.password="$(openssl rand -hex 24)"
    # (URL-safe; it is embedded in DATABASE_URL.)
    password: ""
  primary:
    initdb:
      scripts:
        create-dbs.sql: |
          CREATE DATABASE auth;
          CREATE DATABASE products;
          CREATE DATABASE jobs;

jobs:
  enabled: true
  replicas: 1
  image: '905418201315.dkr.ecr.us-east-1.amazonaws.com/jobber/jobs:latest'
  port:
    http: 3001
    grpc: 5002

executor:
  enabled: true
  replicas: 1
  image: '905418201315.dkr.ecr.us-east-1.amazonaws.com/jobber/executor:latest'
  port: 3002

auth:
  enabled: true
  replicas: 1
  image: '905418201315.dkr.ecr.us-east-1.amazonaws.com/jobber/auth:latest'
  port:
    http: 3000
    grpc: 5000
  jwt:
    # Never commit the JWT secret. Pass it at install time:
    #   --set auth.jwt.secret="$(openssl rand -base64 48)"
    secret: ""
    expirationMs: "28800000"
    secure: false

products:
  enabled: true
  replicas: 1
  image: '905418201315.dkr.ecr.us-east-1.amazonaws.com/jobber/products:latest'
  port:
    http: 3003
    grpc: 5001