{{- /*
Secrets are never committed to values files. Supply them at install time:
  helm upgrade --install jobber charts/jobber \
    --set auth.jwt.secret="$(openssl rand -base64 48)" \
    --set postgresql.auth.password="$(openssl rand -hex 24)"
or set secrets.existingSecret to a Secret you manage (keys JWT_SECRET,
DB_PASSWORD) and pass postgresql.auth.password the same DB password.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: jobber-secrets
type: Opaque
data:
  JWT_SECRET: {{ required "auth.jwt.secret is required (use --set; never commit it)" .Values.auth.jwt.secret | b64enc | quote }}
  DB_PASSWORD: {{ required "postgresql.auth.password is required (use --set; never commit it)" .Values.postgresql.auth.password | b64enc | quote }}
{{- end }}
