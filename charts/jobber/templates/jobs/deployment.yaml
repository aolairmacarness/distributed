{{- if .Values.jobs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobs
  labels:
    app: jobs
spec:
  replicas: {{ .Values.jobs.replicas }}
  selector:
    matchLabels:
      app: jobs
  template:
    metadata:
      labels:
        app: jobs
    spec:
      {{- include "common.podSecurityContext" . | nindent 6 }}
      initContainers:
        - name: prisma-migrate
          image: {{ .Values.jobs.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c"]
          args:
            - |
              npx prisma migrate deploy --schema=apps/jobs/prisma/schema.prisma
          env:
            {{- include "common.env" . | nindent 12 }}
            {{- include "common.dbEnv" (dict "root" . "db" "jobs") | nindent 12 }}
      containers:
        - name: jobs
          image: {{ .Values.jobs.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "common.containerSecurityContext" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: uploads-volume
              mountPath: /app/apps/jobs/uploads
            {{- include "common.tmpMount" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.jobs.port.http }}
            - containerPort: {{ .Values.jobs.port.grpc }}
          env:
            {{- include "common.env" . | nindent 12 }}
            - name: AUTH_GRPC_SERVICE_URL
              value: "auth-grpc:{{ .Values.auth.port.grpc }}"
            - name: PORT
              value: "{{ .Values.jobs.port.http }}"
            - name: JOBS_GRPC_SERVICE_URL
              value: "0.0.0.0:{{ .Values.jobs.port.grpc }}"
            {{- include "common.dbEnv" (dict "root" . "db" "jobs") | nindent 12 }}
      volumes:
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: uploads-pvc
        {{- include "common.tmpVolume" . | nindent 8 }}
{{- end }}
