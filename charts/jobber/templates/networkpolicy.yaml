{{- if .Values.networkPolicy.enabled }}
# Default-deny ingress for all Jobber pods, then allow only the paths the
# system needs. Internal gRPC services have no auth of their own, so they
# must only be reachable from their callers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobber-default-deny-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [auth, jobs, products, executor]
  policyTypes: [Ingress]
---
# Public HTTP (GraphQL / uploads) for auth and jobs, via the ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobber-allow-http
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [auth, jobs]
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ .Values.auth.port.http }}
        - port: {{ .Values.jobs.port.http }}
---
# auth gRPC: only from jobs (GqlAuthGuard).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobber-allow-auth-grpc
spec:
  podSelector:
    matchLabels:
      app: auth
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: jobs
      ports:
        - port: {{ .Values.auth.port.grpc }}
---
# jobs gRPC (Acknowledge/Fail): only from executor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobber-allow-jobs-grpc
spec:
  podSelector:
    matchLabels:
      app: jobs
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: executor
      ports:
        - port: {{ .Values.jobs.port.grpc }}
---
# products gRPC (CreateProduct): only from executor.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jobber-allow-products-grpc
spec:
  podSelector:
    matchLabels:
      app: products
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: executor
      ports:
        - port: {{ .Values.products.port.grpc }}
{{- end }}
