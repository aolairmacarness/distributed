{{- if .Values.products.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products
  labels:
    app: products
spec:
  replicas: {{ .Values.products.replicas }}
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      {{- include "common.podSecurityContext" . | nindent 6 }}
      initContainers:
        - name: drizzle-migrate
          image: {{ .Values.products.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c"]
          args:
            - |
              cd apps/products && npx drizzle-kit migrate
          env:
            {{- include "common.env" . | nindent 12 }}
            {{- include "common.dbEnv" (dict "root" . "db" "products") | nindent 12 }}
      containers:
        - name: products
          image: {{ .Values.products.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- include "common.containerSecurityContext" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "common.tmpMount" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.products.port.http }}
            - containerPort: {{ .Values.products.port.grpc }}
          env:
            {{- include "common.env" . | nindent 12 }}
            - name: PORT
              value: "{{ .Values.products.port.http }}"
            - name: PRODUCTS_GRPC_SERVICE_URL
              value: "0.0.0.0:{{ .Values.products.port.grpc }}"
            {{- include "common.dbEnv" (dict "root" . "db" "products") | nindent 12 }}
      volumes:
        {{- include "common.tmpVolume" . | nindent 8 }}
{{- end }}
